automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
        - "claude-sonnet-5-5"
        - "gpt-6.1-sol"
        - "gpt-6-luna"
      framework: >-
        Claude Code (Claude Opus 5.5, Claude Sonnet 5.5) and Codex (GPT-6.1
        Sol, GPT-6 Luna), directed by the authors.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2, on top of the Lean formalization of
        "Anomalous diffusion by fractal homogenization". The exact Lean
        statements of the main results and of the definitions they use were
        written first, reviewed against the source by an independent model
        and by the authors, and kept fixed while their proofs were developed.
        Verification uses full builds, axiom checks, and the Mathlib-only
        comparator challenge with Lean's comparator and the independent kernel
        checkers bundled with the toolchain.
      cost:
        wall_time: "about two weeks of Lean development (2026-10-04 to 2026-10-17)"
        spend_usd: "not separately tracked (subscription-based usage)"
        hardware: "one shared 16-core / 124 GB RAM Linux machine"
      prompting_notes: >-
        The authors wrote a detailed outline of the proof. From it, the
        authors together with Claude Opus 5.5 and GPT-6.1 Sol first produced a
        long, unpolished manuscript (612 pages) in which every detail of the
        proof was filled in, and this manuscript was then formalized. The
        authors determined the statements of the main results and directed
        the development. Claude
        Opus 5.5 coordinated the work throughout; the Lean code was written by
        Claude Opus 5.5 and Claude Sonnet 5.5, with some of it written by
        GPT-6.1 Sol and GPT-6 Luna.
  spend_usd: "not separately tracked (subscription-based usage)"
  notes: >-
    All Lean code was written by the listed models under the direction of the
    authors. Every proof is checked by the Lean kernel; the library contains
    no sorry and no custom axiom. The paper was drafted by AI agents under the
    direction of the authors, following the Lean, and then checked by the
    authors, who rewrote parts of it themselves and directed AI agents in
    rewriting the rest, as its introduction states. Claude Sonnet 5.5 and
    GPT-6-Astra checked the paper's statements against the Lean statements.

fidelity:
  divergences: >-
    The Lean statements of the main results are those of the paper, up to
    the following differences of form. Functions on T^2 are Z^2-periodic
    functions on R^2, and integrals over T^2 are integrals over the open unit
    square. Where the paper bounds a norm in L^infinity in time, the Lean
    statement gives the bound at every time, for a periodic representative
    that is jointly continuous in time and space. Theorem B's decay bound is
    stated squared, for t > a. The velocity field of the construction is
    given as the pointwise limit of the velocity fields of the stream
    functions defined by the recursion of Section 2. Theorem C is stated for
    every tube duration 8T with T comparable to h_{m+1} and 8 T a_m <= c_*,
    which includes the paper's T = h_{m+1}, and bounds the solution in
    physical variables on the moving disc, which gives the paper's bound in
    the Lagrangian variables with 2C in place of C. In Corollary D the
    sequence of diffusivities is indexed by the natural numbers, the
    subsequence is given by a strictly increasing map, and the convergence is
    that of continuous versions of the solutions. The existential forms of
    Theorems A and B are consequences of the forms for the construction.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
    - "Vlad Vicol"
  notes: >-
    Lean checks each proof against its formal statement. The authors reviewed
    that the statements of the main results are the intended theorems, and
    each was compared with the source by an independent model review before
    its proof was developed. The comparator declarations are checked
    mechanically. This is not external peer review.

alignment:
  namespace: "AVRegularity"
  correspondence_table: "doc/correspondence.md"
  statements:
    - source: "Theorem A (interior regularity), for the velocity field of Section 2"
      lean: "AVRegularity.interior_regularity_construction"
      module: "AVRegularity.Statements.Main.InteriorRegularityConstruction"
      status: "proved"
      note: "The bound of (3.3) at every time of [a + t0, a + T], with existence of the weak solutions."
    - source: "Theorem A, existential form"
      lean: "AVRegularity.interior_regularity"
      module: "AVRegularity.Statements.Main.InteriorRegularity"
      status: "proved"
      note: "Some alpha-Hölder, periodic, divergence-free velocity field and some disjoint bands accumulating at zero."
    - source: "Theorem B (uniform anomalous dissipation), for the velocity field of Section 2"
      lean: "AVRegularity.uniform_anomalous_dissipation_construction"
      module: "AVRegularity.Statements.Main.UniformAnomalousDissipationConstruction"
      status: "proved"
      note: "(3.5) on [a, a + 1]; (3.6) squared, for t > a."
    - source: "Theorem B, existential form"
      lean: "AVRegularity.uniform_anomalous_dissipation"
      module: "AVRegularity.Statements.Main.UniformAnomalousDissipation"
      status: "proved"
    - source: "Theorems A and B for one velocity field and one set of bands, existential form"
      lean: "AVRegularity.interior_regularity_and_dissipation"
      module: "AVRegularity.Statements.Main.InteriorRegularityAndDissipation"
      status: "proved"
    - source: "Theorem C (local interior regularity)"
      lean: "AVRegularity.local_interior_regularity"
      module: "AVRegularity.Statements.Main.LocalInteriorRegularity"
      status: "proved"
      note: "With n = m + 2, T = h_{m+1}, R = r_tube, varrho = r_obs / r_tube, vartheta = 8 - t0 / h_{m+1}; the bound is stated on the moving disc in physical variables."
    - source: "Corollary D(a) (vanishing-diffusivity limits)"
      lean: "AVRegularity.vanishing_diffusivity_limits"
      module: "AVRegularity.Statements.Main.VanishingDiffusivityLimits"
      status: "proved"
    - source: "Corollary D(b) (vanishing-diffusivity limits in the tubes of Theorem C)"
      lean: "AVRegularity.vanishing_diffusivity_limits_local"
      module: "AVRegularity.Statements.Main.VanishingDiffusivityLimitsLocal"
      status: "proved"

