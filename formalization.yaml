version: "v0.4"

project:
  name: "Anomalous regularization of passive scalars up to the Obukhov–Corrsin exponent"
  description: >-
    A Lean 4 / Mathlib formalization of S. Armstrong and V. Vicol, "Anomalous
    regularization of passive scalars up to the Obukhov–Corrsin exponent"
    (2026, included as doc/paper.pdf). The velocity field b is constructed as in
    Armstrong and Vicol, "Anomalous diffusion by fractal homogenization": a
    bounded, Z^2-periodic, divergence-free field on R x T^2, built from shear
    flows alternating in direction at infinitely many scales, Hölder
    continuous in space and time with exponent alpha < 1/3, with its scale
    separation parameter q taken close to 1 depending on s. For the advection-diffusion
    equation d_t theta + b . grad theta = kappa Laplacian theta on T^2 and
    every s < (1 - alpha)/2, with b built for that s, it proves: the solutions are bounded at positive
    times in C^{0,s}(T^2) by C times the L^2 norm of the initial datum,
    uniformly in kappa in a union of bands accumulating at zero (Theorem A);
    every solution dissipates a fixed fraction of its variance in unit time,
    and the variance decays exponentially, with constants independent of
    kappa in the bands, of the L^2 datum and of the initial time (Theorem B);
    the local form of Theorem A in space-time tubes that follow the flow of
    the coarse velocity fields, without boundary conditions (Theorem C); and
    the compactness of the solutions as kappa tends to zero in the bands,
    with limits that solve the transport equation and satisfy the bounds of
    Theorems A and C (Corollary D). It also contains every statement of
    Part I of the paper.
  authors:
    - "Scott Armstrong"
    - "Vlad Vicol"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Vlad Vicol"
  affiliations:
    - "Scott Armstrong: CNRS & Laboratoire Jacques-Louis Lions, Sorbonne Université and Courant Institute School of Mathematics, Computing, and Data Science, New York University"
    - "Vlad Vicol: Courant Institute School of Mathematics, Computing, and Data Science, New York University"
  license: "Apache-2.0"
  funding:
    - "S. Armstrong was supported by NSF grant DMS-2350340 and by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement number 101200828."
    - "V. Vicol was supported by the Collaborative NSF grant DMS-2307681 and by a Simons Investigator Award."

classification:
  arxiv: ["math.AP"]
  msc2020: ["35B65", "35K15", "35B27", "76F25", "35Q35"]

sources:
  - title: "Anomalous regularization of passive scalars up to the Obukhov–Corrsin exponent"
    authors:
      - "Scott Armstrong"
      - "Vlad Vicol"
    type: "article"
    location: "doc/paper.pdf (165 pp.): Theorems A, B and C, Corollary D, and every numbered statement and display"
    relationship: "formalizes"
    note: >-
      The paper was written after the formalization and follows its
      statements; doc/correspondence.md maps every
      numbered statement and display of the paper to the Lean declarations
      that prove it, or says why none is needed (figures, attributions,
      heuristics). Theorems A, B and C, Corollary D and every statement of
      Part I are formal statements; the propositions and lemmas of Part II
      follow from formal statements, directly or by elementary steps, or are
      proved, where they are used, inside its formal proofs. Some
      results are stated in the paper in a weaker form than their formal
      versions (for example, where the paper bounds a norm in L^infinity in
      time, the formal statement gives the bound at every time).
    license: "© the authors, all rights reserved; included as doc/paper.pdf for reference, not covered by the Apache-2.0 license of the code"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/scottnarmstrong/AVAnomalousDiffusion"
    relationship: "builds-on"
    note: >-
      The Lean formalization of Armstrong and Vicol, "Anomalous diffusion by
      fractal homogenization" (Annals of PDE 11 (2025), arXiv:2305.05048),
      required at commit d4dbc7b11fbf350667013d5ac98a3686f44093f5 (see
      lake-manifest.json). It supplies the ambient space and Sobolev notions
      (Vec, MemL2On, weak gradients, periodic H^1, taken there from the
      CoarseGraining formalization of Armstrong and Kuusi), the conventions
      for functions on the torus, stream functions and their flows, the
      existence and uniqueness of weak solutions, and parts of the analysis
      of that paper (flows and their derivatives, the Faà di Bruno formula,
      cell problems and correctors of the shear pulses, energy and Galerkin
      methods on the torus). Its velocity field fixes the parameter q in
      terms of alpha; the velocity field of the present paper, with q free,
      is constructed in this repository.

status:
  scope: >-
    Complete for the main results of the paper. Theorem A (interior
    regularity) and Theorem B (uniform anomalous dissipation) are stated for
    the velocity field of the paper, for every alpha in (0, 1/3), every s in
    (0, (1 - alpha)/2), every admissible q and cutoff function, and every
    integer Lambda at least a threshold Lambda_0, and also in an existential
    form (some velocity field with the stated regularity and some disjoint
    bands accumulating at zero), separately and jointly for one velocity
    field. Theorem C (local interior regularity in tubes) and Corollary D
    (vanishing-diffusivity limits, global and local) are stated for the
    velocity field of the paper. Theorems A and B also assert the existence
    of the weak solutions, and the construction is shown to exist for every
    integer Lambda >= 128. Every statement of Part I of the paper is a
    formal statement.
